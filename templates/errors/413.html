{% extends "base.html" %}
{% block title %}File too large · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card center">
    <h1>413 · File too large</h1>
    <p class="muted">Your upload exceeded the {{ limit_mb }} MB limit. Try a smaller file.</p>
    
    <div class="btn-row mt-2" style="justify-content:center">
      <a class="btn" href="{{ url_for(current_user.home_endpoint) if current_user.is_authenticated else url_for('public.index') }}">Take me home</a>
    </div>
  </div>
</div>
{% endblock %}
