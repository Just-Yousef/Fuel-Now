{% extends "base.html" %}
{% block title %}Administrator sign in · {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <h1>Administrator sign in</h1>
    <p class="muted">Use an administrator account to access the FuelNow control panel.</p>

    <form method="post" action="{{ url_for('auth.admin_login') }}" class="mt-2">
      {{ csrf_field() }}
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="field">
        <label for="email">Administrator email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="field flex-between">
        <label class="checkline" style="margin:0;font-weight:400;text-transform:none;letter-spacing:0">
          <input type="checkbox" id="remember" name="remember">
          <span>Keep me signed in</span>
        </label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size:.82rem">Forgot password?</a>
      </div>
      <button class="btn block" type="submit">Sign in as administrator</button>
    </form>

    <p class="mt-2 muted"><a href="{{ url_for('auth.login') }}">Sign in with another account</a></p>
  </div>
</div>
{% endblock %}
