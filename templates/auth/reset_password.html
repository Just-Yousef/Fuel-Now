{% extends "base.html" %}
{% block title %}Choose a new password · {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="muted">This link is single-use and expires one hour after it was issued.</p>

    <form method="post" class="mt-2">
      {{ csrf_field() }}
      <input type="hidden" name="token" value="{{ token }}">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <div class="help">At least 8 characters; avoid common passwords.</div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn block" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
